<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — Ganesh Nursery</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100dvh;
        display: grid; place-items: center; text-align: center;
        padding: 32px calc(24px + env(safe-area-inset-left)) calc(32px + env(safe-area-inset-bottom));
        background: #FBF7EE; color: #1E241C;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 18px; }
      h1 { font-size: 1.4rem; margin: 0 0 10px; color: #1B3222; }
      p { margin: 0 0 22px; color: #5A6154; line-height: 1.7; max-width: 34ch; }
      a, button {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px;
        background: #1B3222; color: #FBF7EE;
        font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
      }
      .tel { background: transparent; color: #1B3222; border: 1px solid #1B3222; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div>
      <img src="/brand/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>We can't reach the nursery right now. Check your connection and try again — or just give us a call.</p>
      <div>
        <button onclick="location.reload()">Try again</button>
        <a class="tel" href="tel:+919943119955">Call us</a>
      </div>
    </div>
  </body>
</html>
